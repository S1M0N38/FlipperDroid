# Home smoke flow — run against a Simlock lease:
#   $AD replay docs/flows/home-smoke.yaml --maestro
#
# Covers the legal gate (a freshly leased, freshly installed emulator starts on
# it), the Home grid, and entering one screen. The device-side sibling of
# `HomeSmokeTest` (src/androidTest); see docs/03-device.md.
appId: com.example.flipperdroid.debug
---
- launchApp
- runFlow:
    when:
      visible: "Accept and continue"
    commands:
      - tapOn: "Accept and continue"
- assertVisible: "NFC Reader"
- tapOn: "NFC Reader"
- assertVisible: "Card Reading"
